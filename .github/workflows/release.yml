name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest and card versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/teamcity/manifest.json)
          card=$(jq -r .version frontend/package.json)
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$card" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($manifest) and frontend/package.json ($card)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the card
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Package the integration
        run: |
          test -s custom_components/teamcity/frontend/teamcity-card.js
          cd custom_components/teamcity
          zip -r "$GITHUB_WORKSPACE/teamcity.zip" . -x '__pycache__/*' '*/__pycache__/*'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" teamcity.zip --title "$GITHUB_REF_NAME" --generate-notes
